name: Migration image
on:
  push:
    branches: [codex/dual-stack-migration-sqlite]
permissions:
  contents: read
concurrency:
  group: migration-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/pr.yaml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish migration-only AMD64 image
        env:
          IMAGE: ghcr.io/zekihan/accessrelay
          REVISION: ${{ github.sha }}
        run: |
          tag="0.1.1-migration-sqlite-${REVISION}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "${IMAGE}:${tag}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --build-arg "VERSION=${tag}" \
            .
