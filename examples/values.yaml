connectionSecret: accessrelay-connection
config:
  collection:
    source:
      cluster: example
      namespace: traefik
      container: traefik
  report:
    websocketURL: ws://localhost:8080/ws
# Reports contain client IPs and query strings. Keep external access disabled
# until an operator configures and verifies authentication for every route.
ingress:
  enabled: false
networkPolicy:
  ingressPeers: []
  victoriaLogsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: logs
      podSelector:
        matchLabels:
          app.kubernetes.io/name: victoria-logs-single
