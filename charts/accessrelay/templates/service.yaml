apiVersion: v1
kind: Service
metadata:
  name: {{ include "accessrelay.fullname" . | quote }}
  labels:
    {{- include "accessrelay.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    {{- include "accessrelay.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.authService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.authService.name | quote }}
spec:
  type: ExternalName
  externalName: {{ required "authService.externalName is required" .Values.authService.externalName | quote }}
  ports:
    - name: http
      port: {{ .Values.authService.port }}
{{- end }}
